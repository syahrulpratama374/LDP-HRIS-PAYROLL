; Pengaturan PHP aplikasi LDP HRIS (disalin ke /usr/local/etc/php/conf.d/zz-ldp.ini oleh Dockerfile).
;
; memory_limit 256M: render PDF DomPDF (latar kop A4 + gambar lampiran risalah) dan pengecilan foto saat
; unggah (GD men-decode foto 12 MP ~48 MB sebelum diperkecil) bisa mendekati 128M bawaan. 256M memberi ruang
; aman per request; yang membatasi beban tetap validasi aplikasi (maks 5 MB per berkas, foto diperkecil 1600 px).
memory_limit = 256M

; Unggahan: aplikasi membatasi 5 MB per berkas (nota, bukti transfer, foto risalah) dan maks 10 foto per
; tanggal risalah dalam satu kirim. Bawaan PHP (2M / 8M) menolak berkas > 2 MB sebelum validasi aplikasi.
upload_max_filesize = 6M
post_max_size = 64M
max_file_uploads = 20

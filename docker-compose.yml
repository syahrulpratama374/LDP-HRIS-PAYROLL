version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ldp_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ldp_hris_payroll
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: ldp_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ldp_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - ldp-network

  webserver:
    image: nginx:alpine
    container_name: ldp_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ldp-network

  mysql:
    image: mysql:8.0
    container_name: ldp_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=ldp_hris_payroll
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ldp-network

  redis:
    image: redis:alpine
    container_name: ldp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ldp-network

  vite:
    image: node:20-alpine
    container_name: ldp_vite
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    networks:
      - ldp-network

volumes:
  mysql_data:

networks:
  ldp-network:
    driver: bridge